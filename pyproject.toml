[project]
name = "forensic-agent"
version = "0.1.0"
description = "Modular showcase rebuild of the forensic metascience agent"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "scipy>=1.10"]

[project.optional-dependencies]
pdf = ["pymupdf"]
dev = ["pytest"]

[project.scripts]
forensic-agent = "forensic_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forensic_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
